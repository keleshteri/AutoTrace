name: Release

# Builds installers for Windows, Linux, and macOS and attaches them to a GitHub Release.
# Trigger: push a version tag (v0.1.0) OR run manually from Actions → Release → Run workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Leave empty to use package version."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            name: windows-x64
          - platform: ubuntu-22.04
            args: ""
            name: linux-x64
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-x64

    runs-on: ${{ matrix.platform }}
    name: build-${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux WebKit / bundler deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Configure updater signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "No TAURI_SIGNING_PRIVATE_KEY — building installers without updater artifacts."
            echo "Add the secret (see docs/release.md) for in-app Download & install."
            python3 - <<'PY'
          import json
          path = "src-tauri/tauri.conf.json"
          with open(path) as f:
              cfg = json.load(f)
          cfg.setdefault("bundle", {})["createUpdaterArtifacts"] = False
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          PY
          else
            echo "Updater signing key present — will publish latest.json + signatures."
          fi

      - name: Resolve release tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using release tag: ${TAG}"

      - name: Build Tauri app + upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: AutoTrace ${{ steps.ver.outputs.tag }}
          releaseBody: |
            ## Installers

            Download the asset for your OS below.

            | Platform | Asset |
            |---|---|
            | **Windows** | `.exe` (NSIS) or `.msi` |
            | **Linux** | `.AppImage` or `.deb` |
            | **macOS Apple Silicon** | `.dmg` / `.app` (arm64) |
            | **macOS Intel** | `.dmg` / `.app` (x64) |

            ### Updates
            - In-app: **Settings → Account → Check for updates**
            - Signed updater manifest: `latest.json` (when signing secrets are configured)

            ### Notes
            - Early builds may be **unsigned** — Windows SmartScreen / macOS Gatekeeper can warn; choose “More info → Run anyway” or right-click → Open on macOS.
            - AutoTrace stays **local-first**; cloud sync / OAuth are optional.
            - See `docs/release.md` for build + updater details.
          releaseDraft: false
          prerelease: false
          projectPath: .
          args: ${{ matrix.args }}
